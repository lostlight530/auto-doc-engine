{
  "profile": "auto-doc-engine/maintenance-cadence",
  "calibrated": "2026-08-30",
  "project_profile_prefix": "auto-doc-engine/",
  "canonical_paths": [
    "MANIFEST.yaml",
    "AGENTS.md",
    "RESEARCH_CONTRACT.md",
    "FRONTIER_ALIGNMENT.md",
    "ARTIFACT_RECORD.md",
    "ARTIFACT_LINEAGE_CONTRACT.md",
    "core/artifact_record.py",
    "core/artifact_lineage.py"
  ],
  "scan_paths": ["MANIFEST.yaml", "AGENTS.md", "RESEARCH_CONTRACT.md", "FRONTIER_ALIGNMENT.md", "core"],
  "forbidden_governance_paths": [".github/workflows"],
  "history_patterns": ["*_DAY_CONSOLIDATION.md", "STAGE_*.md"],
  "cadences": {
    "daily": {
      "purpose": "local drift and new-fact maintenance without history rewrite",
      "calibration_max_age_days": 2,
      "baseline_hashes": false,
      "history_inventory": false
    },
    "weekly": {
      "purpose": "cross-day contract reconciliation and phase trend review",
      "calibration_max_age_days": 8,
      "baseline_hashes": true,
      "history_inventory": true
    },
    "monthly": {
      "purpose": "month-to-date or explicit phase-close baseline, history inventory, and deprecation review",
      "calibration_max_age_days": 35,
      "baseline_hashes": true,
      "history_inventory": true
    }
  },
  "boundaries": {
    "automatic_deletion": false,
    "automatic_history_rewrite": false,
    "github_actions": false,
    "codeql": false,
    "merge_gate": false,
    "aggregate_quality_score": false,
    "scientific_validity_claim": false
  }
}
