  ],
  "cadences": {
    "daily": {
      "purpose": "local drift and new-fact maintenance without history rewrite; current repository evidence outranks coding-agent task or PR narrative; no defect permits NO_CHANGE_REQUIRED without activity-only delivery",
      "calibration_max_age_days": 2,
      "baseline_hashes": false,
      "history_inventory": false
    },
    "weekly": {
      "purpose": "cross-day contract reconciliation, document-authority review, agent-provenance review, overlap review, and phase trend review; Daily and Weekly may coalesce into one real final Draft PR",
      "calibration_max_age_days": 8,
      "baseline_hashes": true,
      "history_inventory": true
    },
    "monthly": {
      "purpose": "calendar-month or explicit phase-close baseline, full current-document inventory, and deprecation review without history rewrite",
      "calibration_max_age_days": 35,
      "baseline_hashes": true,
      "history_inventory": true
    }
  },
  "boundaries": {
    "automatic_deletion": false,
    "automatic_history_rewrite": false,
    "github_actions": false,
    "codeql": false,
    "merge_gate": false,
    "aggregate_quality_score": false,
    "scientific_validity_claim": false,
    "calendar_close_is_reproduction": false,
    "scan_scope_outside_repository": false,
    "absolute_repository_root_in_report": false,
    "agent_pr_narrative_is_authority": false,
    "cadence_requires_duplicate_prs": false,
    "checker_definition_is_execution": false,
    "historical_pass_is_current_pass": false,
    "maintenance_freshness_is_capability_change": false
  }
