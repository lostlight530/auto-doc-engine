name: auto-doc-engine
purpose: AST 驱动的文档编译、增量差异、知识图健康检查与标准诊断交换 | AST-driven document compilation, incremental diffing, knowledge-graph health and standard diagnostic interchange

principles:
  - AST优先: 文档结构操作统一经过 Markdown AST，不做脆弱的结构化字符串替换
  - 事实先于声明: README/ARCHITECTURE/MANIFEST 只能声明有源码或测试契约支撑的能力
  - 增量可解释: DiffTracker 输出 add/modify/delete/unchanged，不把结构差异包装为自动安全合并
  - 图谱可诊断: 跨文档断链、孤儿、环和 frontmatter 问题由 doctor 聚合
  - 标准可互操作: doctor 发现可导出 OASIS SARIF 2.1.0 + Errata 01 子集
  - 研究对象边界: digest/provenance 表示身份与谱系证据，不代表科学真值或跨环境复现已完成
  - 失败显式: 外部转换器缺失或质量门失败不得伪装成功

research_contract:
  file: RESEARCH_CONTRACT.md
  status: active
  local_reproducibility_levels: [R0, R1, R2, R3]
  note: local project terminology; R3 requires an actual independent rerun and comparison
  cross_repo_handoff_fields:
    - artifact_id
    - content_sha256
    - source_refs
    - document_status
    - generated_with
    - provenance_ref
    - validation_status

interoperability_targets:
  sarif:
    status: implemented
    version: "2.1.0 + Approved Errata 01"
    profile: auto-doc-engine/sarif@1
    schema: https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json
  ro_crate:
    status: proposed
    version: "1.3"
    published: "2026-06-22"
    note: no RO-Crate writer/validator is claimed until executable conformance contracts exist

engines:
  - renderer
  - ast_engine
  - incremental
  - sync
  - cross_ref
  - doctor
  - frontmatter
  - readability
  - sarif

templates:
  engine: jinja2
  types: [weekly_report, paper_summary, project_status]

data_sources:
  implemented: [csv, json]
  not_integrated: [sqlite, api]

output_formats:
  markdown:
    status: implemented
  html:
    status: optional
    dependency: pandoc_or_mistune_fallback
  docx:
    status: optional
    dependency: pandoc
  pdf:
    status: optional
    dependency: pandoc+xelatex
  epub:
    status: optional
    dependency: pandoc

incremental:
  enabled: true
  tracker: incremental/diff_tracker.yaml
  semantics: structural_diff_only

diagnostics:
  doctor:
    command: python core/doctor.py <docs_dir>
    strict_flag: --strict
    json_flag: --json
  sarif:
    command: python core/sarif.py <docs_dir> -o doctor.sarif
    version: "2.1.0"
    profile: auto-doc-engine/sarif@1
    fingerprint: autoDocFinding/v1
    scope: conservative document-health result subset

dependencies:
  runtime:
    - jinja2
    - mistune>=3.2.1
    - pyyaml
  optional_external:
    - pandoc
    - xelatex
    - cp
  observed_ecosystem_2026_08_23:
    mistune_latest: "3.3.4 observed; compatibility is not inferred from observation alone"
    pandoc_latest: "3.10.2 observed; optional and not automatically validated"

verification:
  local_contract: make test
  github_actions: .github/workflows/ci.yml
  note: CI validates deterministic repository contracts; environment-dependent format converters remain optional

experimental_modules:
  - template_prewarm
  - self_observe
  - async_conduit
  - memory_lattice
  - restart_protocol
