name: auto-doc-engine
purpose: AST 驱动的增量多格式同步文档生成系统 | AST-driven incremental multi-format document generation system
principles:
  - AST优先: 操作文档结构不是字符串
  - 增量更新: 只重新生成变化段落
  - 多格式同步: 一次定义多格式输出
  - 数据源无关: 支持多类型数据源绑定
  - 变更可追溯: 每次生成保留完整变更历史
  - 断链可诊断: 断链分类为 near-miss / dangling 并可被 CI 门禁

# 与 README 能力矩阵中“已实现”的核心模块一一对应
engines:
  - renderer
  - ast_engine
  - incremental
  - sync
  - cross_ref
  - doctor
  - frontmatter
  - readability

templates:
  engine: jinja2
  types: [weekly_report, paper_summary, project_status]
  
data_sources:
  - csv
  - json

# 未集成数据源（当前代码无对应适配器，需设计、实现和测试）
# not_implemented_data_sources:
#   - sqlite  # DataBindingEngine.load_data() 无 SQLite 分支
#   - api     # 无网络数据源适配器、鉴权配置或对应测试
  
# core/sync.py TARGETS 中定义的输出目标；html/docx/pdf/epub 依赖 pandoc，pdf 还依赖 xelatex
output_formats:
  - markdown
  - html
  - docx
  - pdf
  - epub

incremental:
  enabled: true
  # 运行态产物路径，不在仓库中跟踪（见 .gitignore）
  tracker: incremental/diff_tracker.yaml
  
# 运行模块与测试所需的 Python 依赖
dependencies:
  - jinja2
  # 推荐 mistune >= 3.2.1（含转义/注入与 ReDoS 修复）；AST 出口统一 renderer='ast'
  - mistune>=3.2.1  # recommended floor; older 3.x may still run but is not recommended
  - pyyaml

# 外部命令；缺失时对应目标返回 ERROR，不会伪装成功
optional_dependencies:
  - pandoc
  - xelatex

# 文档体检（doctor）：错误级发现（断链、frontmatter schema 错误）退出码非零，可接 CI 门禁
health_check:
  command: python core/doctor.py <docs_dir>
  strict_flag: --strict   # 警告（孤儿文档、环引用、可读性）也计为失败
  json_flag: --json       # 机器可读报告
