name: auto-doc-engine
purpose: "科研文档编译、结构证据、轻量 artifact handoff、断言来源、typed lineage 与 Research Object 打包 | Research-document compilation, structural evidence, assertion-aware artifact handoff, typed lineage and Research Object packaging"
calibrated: "2026-08-29"

principles:
  - AST优先: "文档结构操作经过 Markdown AST，不依赖脆弱字符串替换"
  - 事实先于声明: "公开能力只来自当前源码或明确外部依赖"
  - 增量可解释: "structural diff 为 add/modify/delete/unchanged，不包装成自动安全合并"
  - 元数据有界: "frontmatter 是小型 portable contract，不冒充完整学术本体"
  - 过程披露显式: "AI/tool/human-review 只记录声明式过程元数据"
  - 断言来源显式: "记录字段如何进入 artifact record；basis 不等于 correctness"
  - 覆盖维度分离: "coverage 使用独立计数/比例，不合成科研质量总分"
  - lineage显式: "artifact inheritance 使用 caller-declared typed relations；不从文件名/正文/时间戳猜测"
  - 不继承真值: "reference/revision/supersedes/use 不自动继承 scientific validity 或 reproducibility"
  - 不幻觉: "未知 provider/model/version/source/review 状态保持未知或 not_declared"
  - 不做AI文本检测: "canonical artifact path 不从正文推断 AI 使用或作者资格"
  - 真实版本保留: "真实标准和运行环境版本属于 provenance"
  - Research Object分层: "artifact record/lineage 是项目 handoff，RO-Crate 1.3 是外部 packaging target"
  - 科学边界: "provenance/hash/basis/coverage/lineage/diagnostics/RO-Crate 不自动证明科学真值或独立复现"

stable_project_profiles:
  - auto-doc-engine/doctor
  - auto-doc-engine/sarif
  - auto-doc-engine/artifact-record
  - auto-doc-engine/artifact-lineage
  - auto-doc-engine/process-disclosure
  - auto-doc-engine/frontmatter-validation
  - auto-doc-engine/ro-crate

profile_identifier_policy:
  decorative_versions_allowed: false
  examples_forbidden: ["@1", "@2", "/v1"]
  compatibility_source: "documented fields + semantics"
  real_external_versions_preserved: true

research_contract:
  file: RESEARCH_CONTRACT.md
  status: active
  companion_artifact_record: ARTIFACT_RECORD.md
  companion_artifact_lineage: ARTIFACT_LINEAGE_CONTRACT.md
  companion_process_disclosure: PROCESS_DISCLOSURE.md
  companion_assertion_basis_coverage: ASSERTION_BASIS_AND_COVERAGE.md
  five_day_consolidation: FIVE_DAY_CONSOLIDATION.md
  six_day_consolidation: SIX_DAY_CONSOLIDATION.md
  local_reproducibility_levels: [R0, R1, R2, R3]
  r3_semantics: "actual separate rerun plus declared comparison criterion"

cross_repo_handoff:
  primary_profile: auto-doc-engine/artifact-record
  lineage_profile: auto-doc-engine/artifact-lineage
  downstream_epistemic_profile: epistemic-pipeline/evidence-envelope
  downstream_claim_verification: epistemic-pipeline/claim-verification
  downstream_claim_transfer: epistemic-pipeline/claim-transfer
  downstream_figure_audit: sci-render-kit/figure-claim-audit
  downstream_figure_profile: sci-render-kit/figure-evidence
  downstream_communication_transfer: sci-render-kit/communication-transfer
  direct_runtime_coupling: false

integrated_modules:
  renderer:
    path: core/renderer.py
    sources: [json, csv, yaml, yml]
    strict_loading: optional
  ast_engine:
    path: core/ast_engine.py
    identity: sha256
    semantics: normalized_structural_markdown
    byte_roundtrip_claim: false
  incremental:
    path: core/incremental.py
    identity: sha256_truncated_16_hex
    actions: [add, modify, delete, unchanged]
    history_write: atomic_replace
    semantics: structural_change_report_not_merge
  cross_ref:
    path: core/cross_ref.py
    scope: local_markdown_links
    diagnostics: [near_miss, dangling, recurring_target]
  frontmatter:
    path: core/frontmatter.py
    ai_assistance_values: [none, used, not_declared]
    human_review_values: [reviewed, partial, not_reviewed, not_declared]
    authorship_claim: false
    peer_review_claim: false
    scientific_validity_claim: false
  readability:
    path: core/readability.py
    semantics: descriptive_heuristics_only
  doctor:
    path: core/doctor.py
    profile: auto-doc-engine/doctor
    outputs: [text, json]
    github_merge_policy: false
  sarif:
    path: core/sarif.py
    profile: auto-doc-engine/sarif
    standard: "OASIS SARIF 2.1.0 + Approved Errata 01"
    fingerprint: autoDocFinding
    source_profile: auto-doc-engine/doctor
  sync:
    path: core/sync.py
    markdown_copy: python_shutil_copy2
    external_process_shell: false
    optional_outputs: [artifact_record, ro_crate]
  artifact_record:
    path: core/artifact_record.py
    profile: auto-doc-engine/artifact-record
    process_profile: auto-doc-engine/process-disclosure
    source_identity: sha256
    derivative_identity: sha256
    metadata_identity: canonical_sha256_selected_mapping
    assertion_basis:
      document_metadata: document-frontmatter
      declared_authors: document-frontmatter
      declared_sources: document-frontmatter-with-optional-local-resolution
      process_disclosure: document-frontmatter
      artifact_identity: runtime-observed-local-bytes
      lineage_references: caller-declared-with-optional-local-resolution
      automatic_ai_detection_used: false
    audit_coverage:
      dimensions:
        - derivative_count
        - declared_source_reference_resolution
        - lineage_reference_resolution
        - process_disclosure_declared_fields
        - frontmatter_error_count
        - frontmatter_warning_count
      aggregate_score: null
      correctness_claim: false
      source_credibility_claim: false
      probability_claim: false
    local_file_reference_hashing: true
    remote_reference_dereference: false
    payload_text_embedded: false
    r3_self_award: false
    scientific_validity_claim: false
    authorship_claim: false
    peer_review_claim: false
  artifact_lineage:
    path: core/artifact_lineage.py
    profile: auto-doc-engine/artifact-lineage
    relations: [derived-from, revision-of, supersedes, uses, related-to]
    relation_basis: caller_declared
    local_reference_hashing: true
    remote_reference_dereference: false
    aggregate_score: null
    semantic_equivalence_claim: false
    scientific_validity_inherited: false
    reproducibility_inherited: false
  ro_crate:
    path: core/ro_crate.py
    profile: auto-doc-engine/ro-crate
    standard_version: "1.3"
    published: "2026-06-22"
    context: https://w3id.org/ro/crate/1.3/context
    specification_id: https://w3id.org/ro/crate/1.3
    external_validator_claim: false
    workflow_run_crate_conformance_claim: false

sync_configuration:
  file: sync/targets.yaml
  artifact_record:
    opt_in: true
    default_emit: false
    default_reproducibility_level: R1
  research_object:
    opt_in: true
    default_emit: false
  pandoc_path_configurable: true

not_integrated:
  - sqlite_data_source
  - network_api_data_source
  - semantic_diff
  - automatic_conflict_resolution
  - crdt_or_ot_merge
  - immutable_provenance_ledger
  - automatic_ai_text_detection
  - automatic_artifact_relation_inference
  - provenance_soundness_validator
  - source_credibility_adjudication
  - external_ro_crate_certification
  - workflow_run_crate_conformance
  - automatic_authorship_adjudication
  - publisher_policy_compliance_engine
  - peer_review_engine

experimental_modules:
  template_prewarm: bounded_in_memory_lru_for_caller_results
  async_conduit: bounded_priority_scheduler_for_caller_handlers
  memory_lattice: local_json_node_link_store_with_numeric_bucket_index
  restart_protocol: event_replay_with_result_hash_verification
  self_observe: explicit_instrumentation_and_descriptive_timing

frontier_calibration:
  checked_through: "2026-08-29"
  signals:
    - provenance_grounds_trust_in_autonomous_science
    - responsible_transparent_ai_scientific_publishing
    - artifact_centered_claim_aware_observability
    - trajectories_to_evidence
    - brain_researcher_evidence_bounded_claims
    - earthverse_end_to_end_consistency
    - claim_level_auditability_provenance_coverage
    - ai_text_detection_distinct_from_disclosure
    - praxist_solution_lineages
    - reproagent_persistent_implementation_contract
  borrowed_scope: "artifact identity + assertion basis + dimensional coverage + typed inheritance/lineage + explicit non-inheritance boundaries"
  endorsement_or_certification_claim: false

interoperability:
  sarif:
    version: "2.1.0 + Approved Errata 01"
    status: implemented
  ro_crate:
    version: "1.3"
    status: implemented_core_export
    external_validator_claim: false
  process_disclosure:
    profile: auto-doc-engine/process-disclosure
    status: implemented_project_contract
  citation_file_format:
    version: "1.2.0"
    file: CITATION.cff

local_checks:
  mode: manual_optional
  github_actions: false
  codeql: false
  merge_gate: false
  tests_required_for_this_refresh: false
